name: 비밀 열쇠를 malro-dapjang 저장소로 옮기기 (한 번만)

# 신부님 요청으로 만든 한 번용 작업. 값은 기록에 나오지 않고,
# 새 저장소의 공개 열쇠로 잠가서 넣음. 끝나면 이 파일과 COPY_TOKEN 을 지움.
on:
  push:
    branches: [claude/new-session-8ex4o5]
    paths: [".github/workflows/copy-secrets.yml"]

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet pynacl
      - name: 옮기기
        env:
          COPY_TOKEN: ${{ secrets.COPY_TOKEN }}
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.request
          from nacl import encoding, public
          tok = os.environ.get("COPY_TOKEN", "").strip()
          if not tok:
              sys.exit("COPY_TOKEN 비밀이 없습니다")
          api = "https://api.github.com/repos/mernial/malro-dapjang/actions/secrets"
          def call(method, url, body=None):
              req = urllib.request.Request(url, method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Authorization": "Bearer " + tok,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req) as r:
                  return r.status, r.read()
          _, raw = call("GET", api + "/public-key")
          key = json.loads(raw)
          box = public.SealedBox(public.PublicKey(key["key"].encode(), encoding.Base64Encoder()))
          ok = True
          for name in ["SIGNING_KEY_B64", "PLAY_SERVICE_ACCOUNT_JSON"]:
              val = os.environ.get(name, "")
              if not val:
                  print(f"{name}: 예전 저장소에 값이 없음 X"); ok = False; continue
              enc = base64.b64encode(box.encrypt(val.encode())).decode()
              status, _ = call("PUT", f"{api}/{name}", {"encrypted_value": enc, "key_id": key["key_id"]})
              print(f"{name}: 옮김 OK ({status})")
          sys.exit(0 if ok else 1)
          PY
